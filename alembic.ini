# Developer convenience: `alembic -c alembic.ini upgrade head`
# The URL is read from PYPOS_DATABASE_URL (see src/pypos/persistence/migrations/env.py).
[alembic]
script_location = src/pypos/persistence/migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
