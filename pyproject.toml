[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypos-framework"
version = "0.1.0"
description = "PyPOS: a modular, typed point-of-sale framework for Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PyPOS contributors" }]
keywords = ["pos", "point-of-sale", "retail", "inventory", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "SQLAlchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "packaging>=23.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
cli = ["typer>=0.12"]
postgres = ["psycopg[binary]>=3.1"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]
all = ["pypos-framework[api,cli,postgres]"]

[project.scripts]
pypos = "pypos.cli:main"

[project.urls]
Homepage = "https://github.com/lilbossgrim/dev/pypos"
Documentation = "https://github.com/lilbossgrim-dev/pypos/tree/main/docs"
Issues = "https://github.com/lilbossgrim-dev/pypos/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypos = ["py.typed", "persistence/migrations/*.mako", "persistence/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "sqlalchemy: needs SQLAlchemy installed",
    "api: needs FastAPI installed",
    "cli: needs Typer installed",
]

[tool.coverage.run]
source = ["pypos"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]
extend-exclude = ["src/pypos/persistence/migrations/versions"]  # generated, frozen

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["B008", "E501"]  # line length is enforced by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pypos"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sqlalchemy.*", "alembic.*", "fastapi.*", "typer.*", "starlette.*", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# these modules depend on optional extras; with the extras installed they are fully typed
module = ["pypos.api.app", "pypos.cli", "pypos.persistence.sql", "pypos.persistence.schema"]
disallow_untyped_decorators = false
warn_unused_ignores = false
disallow_any_unimported = false
